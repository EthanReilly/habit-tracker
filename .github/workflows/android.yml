name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk atomic-habits.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atomic-habits-apk
          path: atomic-habits.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest atomic-habits.apk \
            --title "Atomic Habits (latest build)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Download atomic-habits.apk on your Android phone and open it to install."
